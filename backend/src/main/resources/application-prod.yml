server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:leargas_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:leargas_user}
    password: ${DB_PASSWORD:leargas_secure_password_2026}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins:
      - "https://leargasenergy.com"
      - "https://www.leargasenergy.com"
