services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leargas_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://leargasenergy.com
    expose:
      - "3000"
    networks:
      - leargas_network

  nginx:
    image: nginx:alpine
    container_name: leargas_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - leargas_network

networks:
  leargas_network:
    driver: bridge
